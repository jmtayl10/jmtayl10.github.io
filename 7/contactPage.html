<!DOCTYPE html>
<html lang="en" data-access="locked">
<head>
    <meta charset="utf-8">
    <meta name="Author" content="Jasmine Taylor">
    <meta name="Description" content="Project 3 for CSCI 3054.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="keywords" content="space, stars, lifecycles, alien, cat">
     <!--Links copied from Google in order to use a more space-like font.-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/contactPageStyles.css">
    <link rel="stylesheet" href="CSS/auth.css">
    <title> Dusty's Star Log: Contact Dusty </title>

</head>
<body>
   <nav class="navbar">
    <div class="nav-container">
        <div class="nav-logo">DUSTY'S STAR LOG</div>

        <!--I used an LLM to create the hamburger menu for mobile view. Previously had no idea
        how to create this.-->
        <button class="nav-toggle" aria-expanded="false" aria-controls="nav">☰ Menu</button>

        <ul class="nav-links" id="nav">
            <li data-show-when="out"><a href="login.html" class="nav-item">User Login</a></li>
            <li><a href="index.html" class="nav-item">Main Page</a></li>
            <li><a href="starLogPage.html" class="nav-item">Star Log</a></li>
            <li><a href="moreInfoPage.html" class="nav-item">More Info</a></li>
            <li><a href="contactPage.html" class="nav-item active" aria-current="page">Contact Dusty</a></li>
            <li data-show-when="in"><a href="password.html" class="nav-item">Change Password</a></li>
            <li data-show-when="in"><a href="#" class="nav-item" data-logout>Log Out</a></li>
        </ul>
    </div>
</nav>

    <main class="container">

        <div class="dusty">
        <img src="CSS/img/loginheader.png" alt="My drawing of a green alien cat, wearing a red bandana and brown goggles." class="dusty-img">
        </div>

        <header id='header' class="login-header">
            <h1>CONTACT DUSTY</h1>   
            <P>Enter your information to contact the mothership.</P>
        </header>

        <form class="card" id="contact-form">
 
            <div class="input-field">
                <input type="email" id="email" name="email" placeholder="EMAIL" aria-label="Email" required>
            </div>
 
            <div class="input-field">
                <input type="text" id="name" name="name" placeholder="NAME" aria-label="Name" required>
            </div>
 
            <div class="input-field" id="message-field">
                <input style= "margin-bottom: auto;" type="text" id="message" name="message" placeholder="MESSAGE..." aria-label="Message" required>
            </div>
 
            <button type="submit" class="launch-btn">SEND OFF</button>
        </form>
 
        <p id="contact-message" class="message" role="alert"></p>
    </main>

    <footer>2026, Jasmine Taylor. All Rights Reserved.</footer>
    
    <!-- The javascript was necessary for the hamburger menu, wasn't sure what other navigation
     to go with on mobile that wouldn't use javascript. I used an LLM to figure this out.-->
 <script>
    const toggle = document.querySelector('.nav-toggle');
    const nav = document.getElementById('nav');
    toggle.addEventListener('click', () => {
      const open = nav.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open);
      });
    </script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/starLogData.js"></script>
</body>
</html>
