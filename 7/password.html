<!DOCTYPE html>
<html lang="en" data-access="locked">
<head>
    <meta charset="utf-8">
    <meta name="Author" content="Jasmine Taylor">
    <meta name="Description" content="Project 3 for CSCI 3054.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="space, stars, lifecycles, alien, cat">
    <!--Links copied from Google in order to use a more space-like font.-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/auth.css">
    <link rel="stylesheet" href="CSS/loginsignup.css">
    <title>Dusty's Star Log: Change Password</title>
</head>
<body>
     <nav class="navbar">
    <div class="nav-container">
        <div class="nav-logo">DUSTY'S STAR LOG</div>

        <!--I used an LLM to create the hamburger menu for mobile view. Previously had no idea
        how to create this.-->
        <button class="nav-toggle" aria-expanded="false" aria-controls="nav">☰ Menu</button>

        <ul class="nav-links" id="nav">
            <li data-show-when="out"><a href="login.html" class="nav-item">User Login</a></li>
            <li><a href="index.html" class="nav-item">Main Page</a></li>
            <li><a href="starLogPage.html" class="nav-item">Star Log</a></li>
            <li><a href="moreInfoPage.html" class="nav-item">More Info</a></li>
            <li><a href="contactPage.html" class="nav-item">Contact Dusty</a></li>
            <li data-show-when="in"><a href="password.html" class="nav-item active" aria-current="page">Change Password</a></li>
            <li data-show-when="in"><a href="#" class="nav-item" data-logout>Log Out</a></li>
        </ul>
    </div>
</nav>
  <main class="password-card">
    <div class="auth-panel">
    <h2>Change password</h2>
    <p class="auth-sub">Enter your current password, then your new one (at least 6 characters).</p>
    <form class="auth-form" id="password-form">
      <label for="current-password">Current password</label>
      <input type="password" id="current-password" required>
      <label for="new-password">New password</label>
      <input type="password" id="new-password" minlength="6" required>
      <button type="submit" class="auth-btn auth-btn--primary">Change password</button>
    </form>
    <p id="password-message" class="auth-message" role="alert"></p>
 
    <p><a href="index.html" class="back">Back to Home</a></p>
    </div>
  </main>
    <!-- Hamburger menu for mobile view. -->
    <script>
    const toggle = document.querySelector('.nav-toggle');
    const nav = document.getElementById('nav');
    toggle.addEventListener('click', () => {
      const open = nav.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open);
      });
    </script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
